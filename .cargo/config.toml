# Cross-compilation target configuration
# Install targets: rustup target add <target>
#
# Available targets with installed toolchains:
#   Native:  x86_64-unknown-linux-gnu (host)
#   Linux:   x86_64-unknown-linux-musl, aarch64-unknown-linux-gnu
#   Windows: x86_64-pc-windows-gnu (via mingw-w64)
#
# Targets without local toolchains (CI/container only):
#   aarch64-unknown-linux-musl (needs aarch64-linux-musl-gcc)
#   x86_64-apple-darwin, aarch64-apple-darwin (needs osxcross)
#   x86_64-pc-windows-msvc, aarch64-pc-windows-msvc (needs MSVC/lld-link)

[target.x86_64-unknown-linux-musl]
linker = "musl-gcc"

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"

[env]
RUST_MIN_STACK = "33554432"
