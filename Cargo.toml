[package]
name = "magi-lang"
version = "0.3.0-alpha"
edition = "2021"
description = "MAGI programming language — parser, AST, interpreter, and type checker"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-lsp = "0.20"
tracing = "0.1"
toml = "0.8"
wasm-encoder = "0.245"
wasmtime = "29"
ureq = "3"
zstd = "0.13"
lz4_flex = "0.11"
rcgen = "0.13"
x509-parser = "0.16"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
tungstenite = "0.26"

[dev-dependencies]
wasmparser = "0.245"

[[bin]]
name = "magi"
path = "src/bin/magi.rs"
