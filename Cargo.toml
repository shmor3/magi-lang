[package]
name = "magi-lang"
version = "0.3.0-alpha"
edition = "2021"
description = "MAGI programming language — parser, AST, interpreter, and type checker"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-lsp = "0.20"
tracing = "0.1"
toml = "0.8"
wasm-encoder = "0.245"
wasmtime = "29"
ureq = "3"
zstd = "0.13"
lz4_flex = "0.11"
rcgen = "0.13"
x509-parser = "0.16"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
tungstenite = "0.26"
regex = "1"
sha2 = "0.10"
md-5 = "0.10"
hmac = "0.12"
crc32fast = "1"
base64 = "0.22"
url = "2"
csv = "1"
serde_yaml = "0.9"
blake3 = "1"
rand = "0.9"
hex = "0.4"
heck = "0.5"
textwrap = "0.16"
ordered-float = "5"
semver = "1"
http = "1"
subtle = "2"
percent-encoding = "2"
slug = "0.1"
data-encoding = "2"
html-escape = "0.2"
strsim = "0.11"

[dev-dependencies]
wasmparser = "0.245"

[[bin]]
name = "magi"
path = "src/bin/magi.rs"
