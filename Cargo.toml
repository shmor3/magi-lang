[package]
name = "magi-lang"
version = "0.9.0"
edition = "2021"
description = "MAGI programming language — parser, AST, interpreter, and type checker"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-lsp = "0.20"
tracing = "0.1"
wasm-encoder = "0.245"
wasmtime = "42"
ureq = "3"
zstd = "0.13"
lz4_flex = "0.12"
rcgen = "0.14"
x509-parser = "0.18"
tungstenite = { version = "0.28", features = ["native-tls"] }
native-tls = "0.2"
regex = "1"
sha2 = "0.10"
csv = "1"
serde_yaml_ng = "0.10"
blake3 = "1"
rand = "0.9"
indexmap = { version = "2", features = ["serde"] }
ariadne = "0.5"
rustyline = "15"

[dev-dependencies]
wasmparser = "0.245"

[features]
default = ["wasm-validate"]
wasm-validate = ["dep:wasmparser"]

[dependencies.wasmparser]
version = "0.245"
optional = true

[[bin]]
name = "magi"
path = "src/bin/magi.rs"
